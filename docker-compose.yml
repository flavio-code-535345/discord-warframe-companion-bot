# Production stack for The Rats Den 69 bot:
#   bot        – Discord bot + MCP server, image published to Docker Hub by GitHub Actions
#   caddy      – HTTPS reverse proxy with automatic Let's Encrypt certificates for BOT_DOMAIN
#   watchtower – pulls new bot images from Docker Hub and restarts the bot (only the bot)
#
# All settings come from variables: a .env file next to this file for `docker compose up -d`,
# or the stack's environment variables in Portainer. See .env.example.

name: rats-den-bot

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  bot:
    image: ${DOCKERHUB_IMAGE:?set DOCKERHUB_IMAGE, e.g. yourname/rats-den-warframe-bot}:${BOT_TAG:-latest}
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:?set DISCORD_TOKEN}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:?set DISCORD_GUILD_ID}
      CLAN_NAME: ${CLAN_NAME:-The Rats Den 69}
      BOT_NAME: ${BOT_NAME:-Cephalon Ordis}
      WARFRAME_PLATFORM: ${WARFRAME_PLATFORM:-pc}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:-}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-}
      ENABLE_WELCOME: ${ENABLE_WELCOME:-false}
      WORLDSTATE_POLL_SECONDS: ${WORLDSTATE_POLL_SECONDS:-600}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-opus-5-5}
      AI_EFFORT: ${AI_EFFORT:-medium}
      AI_WEB_SEARCH: ${AI_WEB_SEARCH:-true}
      AI_USER_HOURLY_LIMIT: ${AI_USER_HOURLY_LIMIT:-20}
      AI_DAILY_LIMIT: ${AI_DAILY_LIMIT:-300}
      ENABLE_MEMBER_LOGGING: ${ENABLE_MEMBER_LOGGING:-false}
      ENABLE_MESSAGE_CONTENT: ${ENABLE_MESSAGE_CONTENT:-false}
      WIKI_INDEX: ${WIKI_INDEX:-true}
      FREE_AI_KEY: ${FREE_AI_KEY:-}
      FREE_AI_URL: ${FREE_AI_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      FREE_AI_MODEL: ${FREE_AI_MODEL:-gemini-flash-latest}
      FREE_AI_FALLBACK_MODEL: ${FREE_AI_FALLBACK_MODEL:-gemini-3.5-flash-lite}
      FREE_AI_DAILY_LIMIT: ${FREE_AI_DAILY_LIMIT:-150}
      LOCAL_AI_URL: ${LOCAL_AI_URL:-}
      LOCAL_AI_MODEL: ${LOCAL_AI_MODEL:-}
      LOCAL_AI_KEY: ${LOCAL_AI_KEY:-}
      LOCAL_AI_TIMEOUT_SECONDS: ${LOCAL_AI_TIMEOUT_SECONDS:-60}
      WORLDSTATE_ENABLED: ${WORLDSTATE_ENABLED:-false}
      WORLDSTATE_URL: ${WORLDSTATE_URL:-}
      WORLDSTATE_SMART_POLL: ${WORLDSTATE_SMART_POLL:-false}
      WORLDSTATE_MAX_POLL_MINUTES: ${WORLDSTATE_MAX_POLL_MINUTES:-30}
      ALLOW_CODE_EDIT: ${ALLOW_CODE_EDIT:-false}
      WATCHTOWER_URL: ${WATCHTOWER_URL:-}
      WATCHTOWER_TOKEN: ${WATCHTOWER_TOKEN:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      PANEL_OWNER_IDS: ${PANEL_OWNER_IDS:-603293720061935626}
      OPERATOR_IDS: ${OPERATOR_IDS:-220147375786688512,603293720061935626}
      SEARXNG_URL: ${SEARXNG_URL:-}
      API_MIN_INTERVAL_MS: ${API_MIN_INTERVAL_MS:-500}
      API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-60}
      API_COOLDOWN_MINUTES: ${API_COOLDOWN_MINUTES:-30}
      API_MAX_RETRIES: ${API_MAX_RETRIES:-2}
      API_PRICE_CACHE_SECONDS: ${API_PRICE_CACHE_SECONDS:-120}
      API_STABLE_CACHE_HOURS: ${API_STABLE_CACHE_HOURS:-24}
      QUEUE_QUESTIONS_CONCURRENCY: ${QUEUE_QUESTIONS_CONCURRENCY:-1}
      QUEUE_SCREENSHOTS_CONCURRENCY: ${QUEUE_SCREENSHOTS_CONCURRENCY:-1}
      QUEUE_MAX_WAITING: ${QUEUE_MAX_WAITING:-20}
      ANSWER_REFRESH_ENABLED: ${ANSWER_REFRESH_ENABLED:-true}
      ANSWER_REFRESH_MAX: ${ANSWER_REFRESH_MAX:-8}
      ANSWER_REFRESH_HOUR_UTC: ${ANSWER_REFRESH_HOUR_UTC:-4}
    volumes:
      - bot-data:/app/data
    ports:
      # Direct access from the host itself (e.g. Claude Code on the server). Everyone else goes through caddy.
      - "127.0.0.1:${BOT_LOCAL_PORT:-3000}:3000"
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Proxies https://BOT_DOMAIN/mcp and /health to the bot. The Host header is passed through,
    # so BOT_DOMAIN must be listed in MCP_ALLOWED_HOSTS when that is set.
    command: caddy reverse-proxy --from ${BOT_DOMAIN:?set BOT_DOMAIN, a DNS name pointing at this server} --to bot:3000
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - bot
    logging: *logging

  watchtower:
    # Maintained fork; the original containrrr/watchtower is archived and fails on current Docker Engine APIs.
    image: nickfedor/watchtower:1
    restart: unless-stopped
    environment:
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: ${WATCHTOWER_POLL_INTERVAL:-300}
      # On-demand updates for the bot's update_bot MCP tool (the bot reaches this over the stack network only)
      WATCHTOWER_HTTP_API_UPDATE: "true"
      WATCHTOWER_HTTP_API_PERIODIC_POLLS: "true"
      WATCHTOWER_HTTP_API_TOKEN: ${WATCHTOWER_TOKEN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    logging: *logging

volumes:
  bot-data:
  caddy-data:
  caddy-config:
